<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Decor Studio Iceland - Consultation Voucher</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #07162b;
      --gold: #c79a4c;
      --cream: #ead39a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      color: var(--cream);
      background: #101010;
      font-family: Arial, sans-serif;
    }

    header {
      width: min(1280px, 100%);
      margin: 0 auto 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(26px, 4vw, 48px);
      font-weight: 400;
    }

    header a {
      color: var(--cream);
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
    }

    main {
      width: min(1280px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid rgba(199, 154, 76, .5);
      background: var(--navy);
      box-shadow: 0 22px 50px rgba(0, 0, 0, .45);
    }

    figure img {
      width: 100%;
      display: block;
    }

    figcaption {
      padding: 12px 16px;
      color: var(--cream);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      body { padding: 14px; }
      header { align-items: start; flex-direction: column; }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Premium consultation voucher</h1>
    <a href="output/pdf/dream-decor-consultation-voucher.pdf">Open print-ready PDF</a>
  </header>
  <main>
    <figure>
      <img src="public/images/voucher-front-presentation.png" alt="Front of Dream Decor consultation voucher">
      <figcaption>Front</figcaption>
    </figure>
    <figure>
      <img src="public/images/voucher-back-presentation.png" alt="Back of Dream Decor consultation voucher">
      <figcaption>Back</figcaption>
    </figure>
  </main>
</body>
</html>
